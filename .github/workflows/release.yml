name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0-beta.0 or 0.1.0'
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest
      dry_run:
        description: Run with --dry-run (no commit, no publish)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-context:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Verify release context
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify release channel
        run: |
          case "$VERSION" in
            *-*) test "$TAG" = "beta" ;;
            *) test "$TAG" = "latest" ;;
          esac

  dry-run:
    needs: validate-context
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify dispatch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Dry-run release
        run: |
          pnpm release "$VERSION" --tag "$TAG" --dry

  release:
    needs: validate-context
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.tag_release.outputs.sha }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify dispatch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify prepared release
        run: |
          test -z "$(git status --porcelain)"
          pnpm release "$VERSION" --tag "$TAG" --skipGit
          test -z "$(git status --porcelain)"

      - name: Tag release
        id: tag_release
        run: |
          release_sha="$(git rev-parse HEAD)"
          tag_api="repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION"

          test "$release_sha" = "$GITHUB_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$release_sha"

          if tag_sha="$(gh api "$tag_api" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$release_sha"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="refs/tags/v$VERSION" \
              --raw-field sha="$release_sha" >/dev/null
          fi

          test "$(gh api "$tag_api" --jq '.object.sha')" = "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  dispatch-publish:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}

    steps:
      - name: Dispatch publish workflow
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v$VERSION" \
            --raw-field version="$VERSION" \
            --raw-field tag="$TAG" \
            --raw-field release_sha="$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
