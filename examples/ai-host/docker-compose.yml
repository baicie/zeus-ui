services:
  ai-host:
    build:
      context: ../..
      dockerfile: examples/ai-host/Dockerfile
    ports:
      - '8788:8788'
    environment:
      ZEUS_AI_DB: /data/ai.sqlite
      ZEUS_AI_WORKSPACE: /data/workspace
      ZEUS_AI_ORIGINS: http://127.0.0.1:5191,http://localhost:5191
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ai-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  ai-data:
