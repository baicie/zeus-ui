name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0-beta.0, 0.2.0-rc.0 or 0.2.0'
        required: true
        type: string
      core_version:
        description: 'The Zeus Core version this UI release was verified against, for example 0.2.0-rc.5. Required, and never derived from version.'
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - rc
          - latest
      dry_run:
        description: Run with --dry-run (no commit, no publish)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-context:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Verify release context
        run: test "$GITHUB_REF" = "refs/heads/main"

      # The version decides the channel; an explicit tag that disagrees with it
      # is a release-channel error. This job intentionally checks out nothing,
      # so the rule below is self-contained shell. scripts/checks/release/
      # check-release-channel.ts enforces the identical rule in the CLI guard
      # and its unit tests keep the two in sync.
      - name: Verify release channel
        run: |
          channel_of() {
            case "$1" in
              *-canary.*) echo canary ;;
              *-rc.*) echo rc ;;
              *-beta.*) echo beta ;;
              *-*) echo invalid ;;
              *) echo latest ;;
            esac
          }
          expected="$(channel_of "$VERSION")"
          if [ "$expected" = invalid ]; then
            echo "::error::unsupported prerelease identifier in $VERSION"
            exit 1
          fi
          if [ "$TAG" != "$expected" ]; then
            echo "::error::version $VERSION must publish under dist-tag $expected, not $TAG"
            exit 1
          fi

  dry-run:
    needs: validate-context
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify dispatch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Dry-run release
        run: |
          pnpm release "$VERSION" --tag "$TAG" --dry

  release:
    needs: validate-context
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.tag_release.outputs.sha }}
      core_commit: ${{ steps.pairing_core.outputs.core-commit }}
      # The Core tag the report verified, e.g. v0.2.0-rc.5. The dispatch
      # re-resolves this tag; building it from the UI version was v1's bug.
      core_tag: ${{ steps.pairing_core.outputs.core-tag }}
      pairing_mode: ${{ steps.pairing_core.outputs.mode }}
      channel: ${{ steps.pairing_core.outputs.channel }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify dispatch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify prepared release
        run: |
          test -z "$(git status --porcelain)"
          # The release version must already be committed on main before this
          # workflow runs. `pnpm release` bumps every package manifest, and the
          # tag below must point at the dispatch revision, so a version bump
          # performed here would have to be pushed and retagged. Assert the
          # manifests already carry the release version instead of running the
          # bump: a mismatch fails closed here rather than publishing a package
          # whose manifest disagrees with its tag.
          node -e "
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.version !== process.env.VERSION) {
            console.error('root package.json is ' + pkg.version + ', expected ' + process.env.VERSION);
            process.exit(1);
          }
          "
          test -z "$(git status --porcelain)"

      # The committed pairing record is what binds this UI release to a Core
      # candidate. It is read here, before the tag exists, so an unpairable
      # version can never be tagged in the first place.
      #
      # `core_commit` is derived from the tag the check just proved, never
      # typed. Before this, the step declared `id: pairing_core` and wrote no
      # output at all, so `core_commit` was the empty string and the dispatch
      # job refused with "pairing record coreCommit is not a full SHA" — after
      # the tag had already been created. The derivation happens here, in the
      # same step that verified it, so there is no window in which the value
      # could come from anywhere else.
      - name: Verify immutable Core/UI pairing
        id: pairing_core
        run: |
          # `--core-version` is required and is not derivable from VERSION.
          # The two repositories release on separate version lines: Core is
          # 0.2.0-rc.5 while the UI line is 0.1.0-beta.N. Passing only
          # --version made the old checker build the Core tag out of the UI
          # version and look up a tag that cannot exist.
          pnpm exec tsx scripts/checks/release/check-release-pairing.ts \
            --version "$VERSION" \
            --core-version "$CORE_VERSION" \
            --release-sha "$GITHUB_SHA" \
            --online \
            --out "$PAIRING_REPORT"

          # Read back what the check proved. The report is the same artifact
          # uploaded as evidence, so the value that gets dispatched and the
          # value an auditor sees are the same bytes.
          CORE_COMMIT=$(node -p "const r=require('$PAIRING_REPORT'); r.coreCommit ?? ''")
          CORE_TAG=$(node -p "const r=require('$PAIRING_REPORT'); r.coreTag ?? ''")
          PAIRING_MODE=$(node -p "require('$PAIRING_REPORT').mode")
          CHANNEL=$(node -p "require('$PAIRING_REPORT').channel ?? ''")

          if [ "$PAIRING_MODE" != "online" ]; then
            echo "::error::the pairing report says mode=$PAIRING_MODE; a release dispatch must be backed by an online check"
            exit 1
          fi

          # The commit requirement is per channel, not universal. `beta` is the
          # pre-contract channel: its Core binding is the exact @zeus-js pins,
          # which the static half already proved. `rc` and `latest` name an
          # immutable Core commit and cannot proceed without one.
          #
          # Protocol v1 required it unconditionally here while the checker
          # skipped pairing for beta, so a beta release passed the check and
          # was then refused by the workflow that had just run it.
          case "$CHANNEL" in
            beta)
              echo "::notice::channel=$CHANNEL pairs through dependency pins; no Core commit is required"
              ;;
            rc|latest)
              if ! [[ "$CORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::channel=$CHANNEL requires the Core commit it was verified against, and the pairing report carries none"
                exit 1
              fi
              ;;
            *)
              echo "::error::the pairing report names no known channel (channel='$CHANNEL')"
              exit 1
              ;;
          esac

          {
            echo "core-commit=$CORE_COMMIT"
            echo "core-tag=$CORE_TAG"
            echo "mode=$PAIRING_MODE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
          PAIRING_REPORT: ${{ runner.temp }}/release-pairing.json
          GH_TOKEN: ${{ github.token }}

      - name: Preserve pairing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-release-pairing-release
          path: ${{ runner.temp }}/release-pairing.json
          if-no-files-found: error

      - name: Tag release
        id: tag_release
        run: |
          release_sha="$(git rev-parse HEAD)"
          tag_api="repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION"

          test "$release_sha" = "$GITHUB_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$release_sha"

          if tag_sha="$(gh api "$tag_api" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$release_sha"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="refs/tags/v$VERSION" \
              --raw-field sha="$release_sha" >/dev/null
          fi

          test "$(gh api "$tag_api" --jq '.object.sha')" = "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  dispatch-publish:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
      CORE_COMMIT: ${{ needs.release.outputs.core_commit }}
      PAIRING_MODE: ${{ needs.release.outputs.pairing_mode }}

    steps:
      # The Core commit comes from the pairing check that already ran and was
      # written into the uploaded report; a moved Core branch or a hand-typed
      # SHA can never be dispatched. This step re-resolves the release tag and
      # requires it to match, so the dispatch proves the Core release the UI was
      # built against is the one that actually exists.
      #
      # The mode check is not decoration: a `static` report has all the
      # commit fields null, so a workflow that somehow dispatched one would be
      # sending evidence-free values down the same path.
      - name: Verify the Core release is immutable
        run: |
          if [ "$PAIRING_MODE" != "online" ]; then
            echo "::error::pairing mode is '$PAIRING_MODE'; the dispatch must be backed by an online pairing check"
            exit 1
          fi
          if ! [[ "$CORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the pairing check produced no coreCommit; refusing to dispatch an unreferenced Core commit"
            exit 1
          fi
          # The Core tag comes from the report, never from `v$VERSION`.
          # `VERSION` is the UI version: on 0.1.0-beta.35 it built the tag
          # `v0.1.0-beta.35` in the Core repository, which cannot exist.
          if [ -z "$CORE_TAG" ]; then
            echo "::error::the pairing report names no coreTag; it must record the Core tag it verified"
            exit 1
          fi
          tag_sha="$(gh api "repos/baicie/zeus/git/ref/tags/$CORE_TAG" \
            --jq '.object | if .type == "tag" then "annotated" else .sha end')"
          if [ "$tag_sha" = "annotated" ]; then
            # An annotated tag names a tag object; peel it to the commit.
            object="$(gh api "repos/baicie/zeus/git/ref/tags/$CORE_TAG" --jq '.object.sha')"
            tag_sha="$(gh api "repos/baicie/zeus/git/tags/$object" --jq '.object.sha')"
          fi
          if [ "$tag_sha" != "$CORE_COMMIT" ]; then
            echo "::error::Core tag $CORE_TAG points at $tag_sha, but the pair was verified against $CORE_COMMIT"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CORE_TAG: ${{ needs.release.outputs.core_tag }}
          CORE_COMMIT: ${{ needs.release.outputs.core_commit }}
          PAIRING_MODE: ${{ needs.release.outputs.pairing_mode }}

      - name: Dispatch publish workflow
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v$VERSION" \
            --raw-field version="$VERSION" \
            --raw-field tag="$TAG" \
            --raw-field release_sha="$RELEASE_SHA" \
            --raw-field core_version="$CORE_VERSION" \
            --raw-field core_commit="$CORE_COMMIT" \
            --raw-field pairing_mode="$PAIRING_MODE"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
          TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
          CORE_COMMIT: ${{ needs.release.outputs.core_commit }}
          PAIRING_MODE: ${{ needs.release.outputs.pairing_mode }}
