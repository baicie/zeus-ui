name: AI Workbench Image

# Builds the AI Workbench and its reference Host, publishes both to GHCR, and
# rolls production onto the new digests.
#
# Two images because the workbench's `/ai-host/` proxy targets the Host by
# service name: shipping one without the other leaves every command and SSE
# stream failing to connect.
#
# Shape mirrors the `zeus` repository's `admin-image.yml` and
# `playground-image.yml`: build → verify tags → pull the exact digest on the
# host → recreate → wait for health.
on:
  push:
    branches: [main]
    paths:
      - 'examples/ai-workbench/**'
      - 'examples/ai-host/**'
      - 'packages/ai-core/**'
      - 'packages/ai-adapters/**'
      - 'packages/ai-primitives/**'
      - 'packages/ai-wc/**'
      - scripts/checks/build-info.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/ai-workbench-image.yml
  pull_request:
    paths:
      - 'examples/ai-workbench/**'
      - 'examples/ai-host/**'
      - .github/workflows/ai-workbench-image.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Roll production onto the built image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-workbench-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WORKBENCH_IMAGE: ghcr.io/${{ github.repository_owner }}/zeus-ai-workbench
  HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/zeus-ai-host

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      workbench_image: ${{ steps.vars.outputs.workbench_image }}
      host_image: ${{ steps.vars.outputs.host_image }}
      workbench_digest: ${{ steps.build_workbench.outputs.digest }}
      host_digest: ${{ steps.build_host.outputs.digest }}
      version: ${{ steps.vars.outputs.version }}
      should_deploy: ${{ steps.vars.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve build variables
        id: vars
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "workbench_image=${WORKBENCH_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "host_image=${HOST_IMAGE}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "date_tag=$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.deploy }}" == "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the paired zeus (Core) commit
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # build-info records which Core the UI was built against. The pairing
          # contract requires a full commit, so resolve the branch.
          sha="${CORE_COMMIT:-}"
          if [[ -z "$sha" ]]; then
            sha="$(gh api "repos/${{ github.repository_owner }}/zeus/commits/main" --jq '.sha')"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a 40-character zeus commit (got '$sha')"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deployment host pulls from a domestic registry: a large image from
      # ghcr.io does not finish inside the SSH session, and mirrors only help
      # while they happen to have the blob. Pushing to TCR moves the cross-border
      # transfer into the publish step, and the host pulls over the cloud network.
      - name: Login to TCR
        if: github.event_name != 'pull_request' && vars.TCR_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TCR_IMAGE }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push the Host
        id: build_host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/ai-host/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.HOST_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.HOST_IMAGE }}:sha-${{ github.sha }}
            ${{ vars.TCR_IMAGE != '' && format('{0}-host:{1}', vars.TCR_IMAGE, steps.vars.outputs.tag) || '' }}
            ${{ vars.TCR_IMAGE != '' && format('{0}-host:sha-{1}', vars.TCR_IMAGE, github.sha) || '' }}
          build-args: |
            ZEUS_CORE_COMMIT=${{ steps.core.outputs.sha }}
            ZEUS_UI_COMMIT=${{ github.sha }}
            ZEUS_VERSION=${{ steps.vars.outputs.version }}
            ZEUS_BUILD_TIME=${{ steps.vars.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=ai-host-image
          cache-to: type=gha,mode=max,scope=ai-host-image
          provenance: false

      - name: Build and push the Workbench
        id: build_workbench
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/ai-workbench/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.WORKBENCH_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.WORKBENCH_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WORKBENCH_IMAGE }}:${{ steps.vars.outputs.date_tag }}
            ${{ vars.TCR_IMAGE != '' && format('{0}-workbench:{1}', vars.TCR_IMAGE, steps.vars.outputs.tag) || '' }}
            ${{ vars.TCR_IMAGE != '' && format('{0}-workbench:sha-{1}', vars.TCR_IMAGE, github.sha) || '' }}
          build-args: |
            ZEUS_CORE_COMMIT=${{ steps.core.outputs.sha }}
            ZEUS_UI_COMMIT=${{ github.sha }}
            ZEUS_VERSION=${{ steps.vars.outputs.version }}
            ZEUS_BUILD_TIME=${{ steps.vars.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=ai-workbench-image
          cache-to: type=gha,mode=max,scope=ai-workbench-image
          provenance: false

      - name: Verify the pushed tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${WORKBENCH_IMAGE}:main"
          docker buildx imagetools inspect "${HOST_IMAGE}:main"

  deploy:
    name: Deploy
    needs: build-and-publish
    if: needs.build-and-publish.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_TAG: ${{ needs.build-and-publish.outputs.tag }}
      IMAGE_REF: ${{ needs.build-and-publish.outputs.workbench_image }}
      IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.workbench_digest }}
      HOST_IMAGE_REF: ${{ needs.build-and-publish.outputs.host_image }}
      HOST_IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.host_digest }}
      # When TCR is configured the host pulls from it instead of ghcr.io.
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      DEPLOY_HOST: ${{ vars.ZEUS_WORKBENCH_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.ZEUS_WORKBENCH_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ vars.ZEUS_WORKBENCH_DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.ZEUS_WORKBENCH_DEPLOY_DIR || '/home/ubuntu/zeus-ai' }}
      CONTAINER: ${{ vars.ZEUS_WORKBENCH_CONTAINER || 'zeus-ai-workbench' }}
      HOST_CONTAINER: ${{ vars.ZEUS_AI_HOST_CONTAINER || 'zeus-ai-host' }}
      HEALTH_URL: http://127.0.0.1:8083/healthz
      GHCR_MIRRORS: ${{ vars.GHCR_MIRRORS || 'ghcr.nju.edu.cn' }}
      SSH_KEY: ${{ secrets.ZEUS_WORKBENCH_DEPLOY_SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.ZEUS_WORKBENCH_DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Check deploy credentials
        id: cred
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "::error::ZEUS_WORKBENCH_DEPLOY_HOST is not set (repository variable)"
            exit 1
          fi
          if [[ -n "${SSH_KEY:-}" ]]; then
            echo "method=key" >> "$GITHUB_OUTPUT"
          elif [[ -n "${SSH_PASSWORD:-}" ]]; then
            echo "method=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set ZEUS_WORKBENCH_DEPLOY_SSH_KEY (preferred) or ZEUS_WORKBENCH_DEPLOY_SSH_PASSWORD"
            exit 1
          fi

      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass

      - name: Upload deploy compose
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")
          COMPOSE_B64="$(base64 < examples/ai-workbench/deploy/docker-compose.deploy.yml | tr -d '\n')"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_DIR}" "${COMPOSE_B64}" <<'REMOTE'
          set -euo pipefail
          DIR="$1"; COMPOSE="$2"
          mkdir -p "$DIR"
          printf '%s' "$COMPOSE" | base64 -d > "$DIR/docker-compose.deploy.yml"
          chmod 644 "$DIR/docker-compose.deploy.yml"
          # Credentials are the operator's and already exist on this host. A
          # deploy must not invent or overwrite them: rotating a token is a
          # deliberate act, not a side effect of a release.
          for required in host.env workbench.env; do
            if [[ ! -f "$DIR/$required" ]]; then
              echo "::error::$DIR/$required is missing. Create it from the deployment docs before deploying."
              exit 1
            fi
          done
          echo "credentials present: host.env, workbench.env"
          echo "compose 已就绪: $DIR/docker-compose.deploy.yml"
          REMOTE

      - name: Rolling update containers
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- \
            "${IMAGE_REF}" "${DEPLOY_TAG}" "${IMAGE_DIGEST}" \
            "${HOST_IMAGE_REF}" "${HOST_IMAGE_DIGEST}" \
            "${CONTAINER}" "${HOST_CONTAINER}" "${DEPLOY_DIR}" "${HEALTH_URL}" "${GHCR_MIRRORS}" \
            "${TCR_IMAGE}" "${TCR_USERNAME}" "${TCR_PASSWORD}" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; TAG="$2"; DIGEST="$3"; HOST_IMAGE="$4"; HOST_DIGEST="$5"
          CONTAINER="$6"; HOST_CONTAINER="$7"; DIR="$8"; HEALTH="$9"; MIRRORS="${10}"
          TCR="${11}"; TCR_USER="${12}"; TCR_PASS="${13}"
          CANONICAL="${IMAGE}:${TAG}"
          HOST_CANONICAL="${HOST_IMAGE}:${TAG}"

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker); echo "==> docker: direct"
          elif sudo -n true >/dev/null 2>&1; then
            DOCKER=(sudo -n docker); echo "==> docker: via sudo"
          else
            echo "::error::No docker access and no passwordless sudo on the host"
            exit 1
          fi

          # A domestic registry the host reaches over the cloud network comes
          # first; ghcr.io is the last resort because the cross-border transfer
          # is what times out.
          if [[ -n "${TCR}" && -n "${TCR_USER}" && -n "${TCR_PASS}" ]]; then
            if [[ "${DOCKER[0]}" == "sudo" ]]; then
              printf '%s' "${TCR_PASS}" |
                sudo -n docker login "${TCR}" -u "${TCR_USER}" --password-stdin >/dev/null
            else
              printf '%s' "${TCR_PASS}" |
                docker login "${TCR}" -u "${TCR_USER}" --password-stdin >/dev/null
            fi
            echo "==> logged in to ${TCR}"
          fi

          pull_pinned() {
            local image="$1" digest="$2" tag="$3" canonical="$4" tcr_ref="$5"
            local repo_path="${image#ghcr.io/}"
            local candidates=()
            [[ -n "${TCR}" && -n "${tcr_ref}" ]] && candidates+=("${tcr_ref}:${tag}")
            if [[ -n "${MIRRORS}" ]]; then
              local mirror_list=() m
              IFS=',' read -r -a mirror_list <<< "${MIRRORS}"
              for m in "${mirror_list[@]}"; do
                m="${m// /}"
                [[ -z "$m" ]] && continue
                [[ -n "$digest" ]] && candidates+=("${m}/${repo_path}@${digest}")
                candidates+=("${m}/${repo_path}:${tag}")
              done
            fi
            [[ -n "$digest" ]] && candidates+=("${image}@${digest}")
            candidates+=("${canonical}")
            local candidate
            for candidate in "${candidates[@]}"; do
              echo "==> pulling ${candidate}"
              # Bound each attempt: an unbounded pull is what killed the session.
              if timeout 300 "${DOCKER[@]}" pull "${candidate}"; then
                "${DOCKER[@]}" tag "${candidate}" "${canonical}"
                return 0
              fi
              echo "    (source failed or timed out, trying next)"
            done
            echo "::error::Every image source failed for ${canonical}"
            return 1
          }

          pull_pinned "${IMAGE}" "${DIGEST}" "${TAG}" "${CANONICAL}" "${TCR:+${TCR}-workbench}"
          pull_pinned "${HOST_IMAGE}" "${HOST_DIGEST}" "${TAG}" "${HOST_CANONICAL}" "${TCR:+${TCR}-host}"

          if [[ "${DOCKER[0]}" == "sudo" ]]; then
            RUN=(sudo -n env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "HOST_IMAGE_REPO=${HOST_IMAGE}" "HOST_IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "HOST_CONTAINER=${HOST_CONTAINER}" "COMPOSE_PROJECT_NAME=${CONTAINER}" "AI_DATA_DIR=/home/ubuntu/zeus-ai/data" docker)
          else
            RUN=(env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "HOST_IMAGE_REPO=${HOST_IMAGE}" "HOST_IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "HOST_CONTAINER=${HOST_CONTAINER}" "COMPOSE_PROJECT_NAME=${CONTAINER}" "AI_DATA_DIR=/home/ubuntu/zeus-ai/data" docker)
          fi

          cd "$DIR"
          set -a
          # shellcheck disable=SC1091
          . ./host.env
          # shellcheck disable=SC1091
          . ./workbench.env
          set +a
          "${RUN[@]}" compose -f docker-compose.deploy.yml up -d --pull never --remove-orphans --force-recreate

          for attempt in $(seq 1 30); do
            sleep 2
            if curl -fsS "${HEALTH}" >/dev/null 2>&1; then
              echo "==> healthy after $((attempt * 2))s"
              "${DOCKER[@]}" ps --filter "name=${CONTAINER}" --filter "name=${HOST_CONTAINER}" --format '{{.Names}} {{.Image}} {{.Status}}'
              exit 0
            fi
          done
          echo "::error::Workbench did not become healthy"
          "${DOCKER[@]}" logs --tail 50 "${CONTAINER}" || true
          "${DOCKER[@]}" logs --tail 50 "${HOST_CONTAINER}" || true
          exit 1
          REMOTE

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/pass
