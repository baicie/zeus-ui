name: Remove NPM Dist Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version that currently owns the tag
        required: true
        type: string
      tag:
        description: npm dist-tag to remove
        required: true
        type: choice
        options:
          - latest

concurrency:
  group: npm-dist-tag-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: Release
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Verify dispatch context
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Remove npm dist-tag
        run: pnpm npm:dist-tag:remove --version "$VERSION" --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
