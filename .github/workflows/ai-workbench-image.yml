name: AI Workbench Image

# Builds the AI Workbench and its reference Host, publishes both to GHCR, and
# rolls production onto the new digests.
#
# Two images because the workbench's `/ai-host/` proxy targets the Host by
# service name: shipping one without the other leaves every command and SSE
# stream failing to connect.
#
# Three stages, each able to fail and retry on its own:
#   1. build: build both linux/amd64 images once and push to GHCR only.
#   2. mirror-tcr: copy the immutable digests to the domestic registry with
#      crane. It never rebuilds; a retry re-copies the same bytes.
#   3. deploy: pull the mirrored digests on the host, verify the revision
#      label, recreate the containers and check they serve.
#
# The split exists because the previous shape pushed both registries from one
# `docker/build-push-action`. Run 42964905300 built both images, pushed the
# manifests to GHCR at 05:20:51, then sat on `exporting to image` until the job
# was cancelled at 06:18:54 — 58 minutes, zero output, deploy skipped. Isolating
# the copy gives it its own timeout and stops a registry stall from holding the
# build open or ever deploying an old image.
on:
  push:
    branches: [main]
    paths:
      - 'examples/ai-workbench/**'
      - 'examples/ai-host/**'
      - 'packages/ai-core/**'
      - 'packages/ai-adapters/**'
      - 'packages/ai-primitives/**'
      - 'packages/ai-wc/**'
      - scripts/checks/build-info.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/ai-workbench-image.yml
  pull_request:
    paths:
      - 'examples/ai-workbench/**'
      - 'examples/ai-host/**'
      - .github/workflows/ai-workbench-image.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Roll production onto the built image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-workbench-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WORKBENCH_IMAGE: ghcr.io/${{ github.repository_owner }}/zeus-ai-workbench
  HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/zeus-ai-host

jobs:
  build:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    # Both images build in ~4 minutes warm. 60 minutes leaves room for a cold
    # pnpm install without letting a hang occupy an hour.
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      workbench_image: ${{ steps.vars.outputs.workbench_image }}
      host_image: ${{ steps.vars.outputs.host_image }}
      workbench_digest: ${{ steps.build_workbench.outputs.digest }}
      host_digest: ${{ steps.build_host.outputs.digest }}
      version: ${{ steps.vars.outputs.version }}
      should_deploy: ${{ steps.vars.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve build variables
        id: vars
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "workbench_image=${WORKBENCH_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "host_image=${HOST_IMAGE}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "date_tag=$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.deploy }}" == "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the paired zeus (Core) commit
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # build-info records which Core the UI was built against. The pairing
          # contract requires a full commit, so resolve the branch.
          sha="${CORE_COMMIT:-}"
          if [[ -z "$sha" ]]; then
            sha="$(gh api "repos/${{ github.repository_owner }}/zeus/commits/main" --jq '.sha')"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a 40-character zeus commit (got '$sha')"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the Host
        id: build_host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/ai-host/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.HOST_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.HOST_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            ZEUS_CORE_COMMIT=${{ steps.core.outputs.sha }}
            ZEUS_UI_COMMIT=${{ github.sha }}
            ZEUS_VERSION=${{ steps.vars.outputs.version }}
            ZEUS_BUILD_TIME=${{ steps.vars.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=ai-host-image
          cache-to: type=gha,mode=max,scope=ai-host-image
          provenance: false

      - name: Build and push the Workbench
        id: build_workbench
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/ai-workbench/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.WORKBENCH_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.WORKBENCH_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WORKBENCH_IMAGE }}:${{ steps.vars.outputs.date_tag }}
          build-args: |
            ZEUS_CORE_COMMIT=${{ steps.core.outputs.sha }}
            ZEUS_UI_COMMIT=${{ github.sha }}
            ZEUS_VERSION=${{ steps.vars.outputs.version }}
            ZEUS_BUILD_TIME=${{ steps.vars.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=ai-workbench-image
          cache-to: type=gha,mode=max,scope=ai-workbench-image
          provenance: false

      - name: Verify the pushed tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${WORKBENCH_IMAGE}:main"
          docker buildx imagetools inspect "${HOST_IMAGE}:main"
          # Size budget. These images are pulled by the host from TCR, and a
          # large one is what makes a cross-border copy unable to finish inside
          # any sane timeout. The budget is a repository variable so a
          # deliberate growth is one settings change, while an accidental
          # regression (copying node_modules back into a runtime stage) fails
          # the build instead of silently doubling the deployment.
          for pair in "host:${HOST_IMAGE}" "workbench:${WORKBENCH_IMAGE}"; do
            name="${pair%%:*}"
            image="${pair#*:}"
            budget_var="AI_${name^^}_IMAGE_MAX_MB"
            budget="${!budget_var:-160}"
            docker buildx imagetools inspect "${image}:main" --format '{{json .Manifest}}' \
              > "/tmp/manifest-${name}.json"
            IMAGE_NAME="${name}" IMAGE_BUDGET="${budget}" MANIFEST="/tmp/manifest-${name}.json" \
              node -e '
                const m = require(process.env.MANIFEST)
                const bytes = (m.layers || []).reduce((a, l) => a + l.size, 0)
                const mb = bytes / 1024 / 1024
                const budget = Number(process.env.IMAGE_BUDGET)
                const name = process.env.IMAGE_NAME
                console.log(`${name}: ${mb.toFixed(1)} MB (budget ${budget} MB)`)
                require("node:fs").appendFileSync(
                  process.env.GITHUB_STEP_SUMMARY,
                  `\n| ${name} image size | ${mb.toFixed(1)} MB |\n| ${name} budget | ${budget} MB |\n`,
                )
                if (mb > budget) {
                  console.error(`::error::${name} image is ${mb.toFixed(1)} MB, over the ${budget} MB budget`)
                  process.exit(1)
                }
              '
          done

  mirror-tcr:
    name: Mirror to TCR
    needs: build
    # Only a real publish has something to mirror. A PR build pushes nothing.
    if: needs.build.outputs.should_deploy == 'true' && vars.TCR_IMAGE != ''
    runs-on: ubuntu-latest
    # Two registry-to-registry copies of one image each. 20 minutes is generous
    # for two ~80 MB images and replaces the old unbounded wait.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      host_digest: ${{ steps.copy_host.outputs.digest }}
      workbench_digest: ${{ steps.copy_workbench.outputs.digest }}
    env:
      # A repository prefix: the tags append `-host` and `-workbench`.
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
    steps:
      - name: Resolve the TCR registry host
        id: tcr
        env:
          TCR_IMAGE: ${{ vars.TCR_IMAGE }}
        run: |
          set -euo pipefail
          host="${TCR_IMAGE%%/*}"
          if [[ ! "$host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::TCR_IMAGE does not start with a registry host: '${TCR_IMAGE}'"
            exit 1
          fi
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "TCR: registry ${host}, repository prefix ${TCR_IMAGE}"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # The source is the immutable digest the build job produced, never a
      # moving tag: a tag can be repointed by a later run, and the mirror must
      # copy exactly the bytes that were built and verified. A retry re-copies
      # the same digest and never rebuilds anything.
      - name: Copy the Host digest to TCR
        id: copy_host
        env:
          SOURCE: ${{ needs.build.outputs.host_image }}
          DIGEST: ${{ needs.build.outputs.host_digest }}
          TCR_HOST: ${{ steps.tcr.outputs.host }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PASS: ${{ secrets.TCR_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::the build job produced no Host digest to mirror"
            exit 1
          fi
          mkdir -p "$HOME/.docker"
          AUTH="$(printf '%s:%s' "${ACTOR}" "${GH_TOKEN}" | base64 | tr -d '\n')"
          TCR_AUTH="$(printf '%s:%s' "${TCR_USER}" "${TCR_PASS}" | base64 | tr -d '\n')"
          cat > "$HOME/.docker/config.json" <<JSON
          {
              "auths": {
                  "ghcr.io": { "auth": "${AUTH}" },
                  "${TCR_HOST}": { "auth": "${TCR_AUTH}" }
              }
          }
          JSON

          start=$(date +%s)
          # Bounded retry inside one overall deadline, sized to end *before*
          # the job timeout: a stalled copy must produce an explicit error with
          # the attempt log, not a cancelled job that looks like a hang.
          COPY_DEADLINE=780
          COPY_ATTEMPT_TIMEOUT=300
          COPY_MAX_ATTEMPTS=3
          output=""
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            remaining=$(( COPY_DEADLINE - ($(date +%s) - start) ))
            if [[ ${attempt} -gt ${COPY_MAX_ATTEMPTS} ]]; then
              echo "::error::TCR copy gave up after ${COPY_MAX_ATTEMPTS} attempts"
              exit 1
            fi
            if [[ ${attempt} -gt 1 && ${remaining} -lt 30 ]]; then
              echo "::error::TCR copy gave up: ${attempt} attempts, deadline ${COPY_DEADLINE}s exhausted"
              exit 1
            fi
            attempt_timeout=${COPY_ATTEMPT_TIMEOUT}
            [[ ${remaining} -lt ${attempt_timeout} ]] && attempt_timeout=${remaining}
            echo "==> TCR copy attempt ${attempt} (timeout ${attempt_timeout}s, ${remaining}s of budget left)"
            # The status is captured on the command itself: after `fi` it would
            # be the `if` statement's status, not the copy's.
            status=0
            output="$(timeout "${attempt_timeout}" crane copy --platform linux/amd64 \
              "${SOURCE}@${DIGEST}" "${TCR_IMAGE}-host:sha-${GITHUB_SHA}")" || status=$?
            [[ ${status} -eq 0 ]] && break
            echo "::warning::TCR copy attempt ${attempt} failed (exit ${status})"
          done
          elapsed=$(( $(date +%s) - start ))

          # A cross-registry copy is not guaranteed to keep the same manifest
          # digest, so the destination's own digest is the identity to record
          # and to deploy by.
          dest_digest="$(timeout 90 crane digest "${TCR_IMAGE}-host:sha-${GITHUB_SHA}" || true)"
          if [[ -z "${dest_digest}" ]]; then
            echo "::error::could not read back the mirrored Host digest"
            exit 1
          fi
          copied="$(printf '%s\n' "${output}" | tail -n 1 | tr -d '[:space:]')"
          if [[ -n "${copied}" && "${copied}" != "${dest_digest}" ]]; then
            echo "::error::TCR tag resolves to ${dest_digest} but the copy reported ${copied}"
            exit 1
          fi
          echo "digest=${dest_digest}" >> "$GITHUB_OUTPUT"
          echo "host copy: ${elapsed}s, source ${DIGEST}, destination ${dest_digest}"

      - name: Copy the Workbench digest to TCR
        id: copy_workbench
        env:
          SOURCE: ${{ needs.build.outputs.workbench_image }}
          DIGEST: ${{ needs.build.outputs.workbench_digest }}
          TCR_HOST: ${{ steps.tcr.outputs.host }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PASS: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::the build job produced no Workbench digest to mirror"
            exit 1
          fi
          # The docker config written by the Host step already carries both
          # registries; crane reads it from $HOME/.docker/config.json.
          start=$(date +%s)
          COPY_DEADLINE=780
          COPY_ATTEMPT_TIMEOUT=300
          COPY_MAX_ATTEMPTS=3
          output=""
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            remaining=$(( COPY_DEADLINE - ($(date +%s) - start) ))
            if [[ ${attempt} -gt ${COPY_MAX_ATTEMPTS} ]]; then
              echo "::error::TCR copy gave up after ${COPY_MAX_ATTEMPTS} attempts"
              exit 1
            fi
            if [[ ${attempt} -gt 1 && ${remaining} -lt 30 ]]; then
              echo "::error::TCR copy gave up: ${attempt} attempts, deadline ${COPY_DEADLINE}s exhausted"
              exit 1
            fi
            attempt_timeout=${COPY_ATTEMPT_TIMEOUT}
            [[ ${remaining} -lt ${attempt_timeout} ]] && attempt_timeout=${remaining}
            echo "==> Workbench TCR copy attempt ${attempt} (timeout ${attempt_timeout}s, ${remaining}s of budget left)"
            status=0
            output="$(timeout "${attempt_timeout}" crane copy --platform linux/amd64 \
              "${SOURCE}@${DIGEST}" "${TCR_IMAGE}-workbench:sha-${GITHUB_SHA}")" || status=$?
            [[ ${status} -eq 0 ]] && break
            echo "::warning::Workbench TCR copy attempt ${attempt} failed (exit ${status})"
          done
          elapsed=$(( $(date +%s) - start ))

          dest_digest="$(timeout 90 crane digest "${TCR_IMAGE}-workbench:sha-${GITHUB_SHA}" || true)"
          if [[ -z "${dest_digest}" ]]; then
            echo "::error::could not read back the mirrored Workbench digest"
            exit 1
          fi
          copied="$(printf '%s\n' "${output}" | tail -n 1 | tr -d '[:space:]')"
          if [[ -n "${copied}" && "${copied}" != "${dest_digest}" ]]; then
            echo "::error::TCR tag resolves to ${dest_digest} but the copy reported ${copied}"
            exit 1
          fi
          echo "digest=${dest_digest}" >> "$GITHUB_OUTPUT"
          echo "workbench copy: ${elapsed}s, source ${DIGEST}, destination ${dest_digest}"

      - name: Record the mirror in the summary
        if: always()
        env:
          HOST_DIGEST: ${{ steps.copy_host.outputs.digest }}
          WORKBENCH_DIGEST: ${{ steps.copy_workbench.outputs.digest }}
          SOURCE_HOST_DIGEST: ${{ needs.build.outputs.host_digest }}
          SOURCE_WORKBENCH_DIGEST: ${{ needs.build.outputs.workbench_digest }}
        run: |
          {
            echo "### TCR mirror"
            echo ""
            echo "| image | source digest | destination digest |"
            echo "| --- | --- | --- |"
            echo "| host | \`${SOURCE_HOST_DIGEST}\` | \`${HOST_DIGEST:-failed}\` |"
            echo "| workbench | \`${SOURCE_WORKBENCH_DIGEST}\` | \`${WORKBENCH_DIGEST:-failed}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The moving tags are updated only after both immutable digests are
      # verified. If this step fails the deployment still deploys the sha
      # digests, so a stale `main` in TCR can never roll production back.
      - name: Publish the moving tags
        env:
          TCR_HOST: ${{ steps.tcr.outputs.host }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PASS: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "${TCR_USER}" "${TCR_PASS}" | base64 | tr -d '\n')"
          mkdir -p "$HOME/.docker"
          cat > "$HOME/.docker/config.json" <<JSON
          {
              "auths": {
                  "${TCR_HOST}": { "auth": "${AUTH}" }
              }
          }
          JSON
          timeout 300 crane tag "${TCR_IMAGE}-host:sha-${GITHUB_SHA}" main
          timeout 300 crane tag "${TCR_IMAGE}-workbench:sha-${GITHUB_SHA}" main
          echo "TCR main -> sha-${GITHUB_SHA} (host, workbench)"

  deploy:
    name: Deploy
    needs: [build, mirror-tcr]
    # `always()` is here only so a *successful* build still deploys when the
    # mirror job was skipped (TCR not configured). It also drops the implicit
    # success condition on `needs`, so both are restated explicitly: a failed
    # build must never deploy, and a configured registry that failed to mirror
    # must stop the release — the host pulls from TCR, and deploying without
    # the new images would silently keep the previous build live.
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.should_deploy == 'true' &&
      (needs.mirror-tcr.result == 'success' || needs.mirror-tcr.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_TAG: ${{ needs.build.outputs.tag }}
      IMAGE_REF: ${{ needs.build.outputs.workbench_image }}
      IMAGE_DIGEST: ${{ needs.build.outputs.workbench_digest }}
      HOST_IMAGE_REF: ${{ needs.build.outputs.host_image }}
      HOST_IMAGE_DIGEST: ${{ needs.build.outputs.host_digest }}
      # When TCR is configured the host pulls from it instead of ghcr.io.
      # The mirror's digests travel too: a cross-registry copy may store a
      # different manifest digest, so the TCR identity is what the host pulls
      # and what the revision label is checked against.
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
      TCR_HOST_DIGEST: ${{ needs.mirror-tcr.outputs.host_digest }}
      TCR_WORKBENCH_DIGEST: ${{ needs.mirror-tcr.outputs.workbench_digest }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      DEPLOY_HOST: ${{ vars.ZEUS_WORKBENCH_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.ZEUS_WORKBENCH_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ vars.ZEUS_WORKBENCH_DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.ZEUS_WORKBENCH_DEPLOY_DIR || '/home/ubuntu/zeus-ai' }}
      CONTAINER: ${{ vars.ZEUS_WORKBENCH_CONTAINER || 'zeus-ai-workbench' }}
      HOST_CONTAINER: ${{ vars.ZEUS_AI_HOST_CONTAINER || 'zeus-ai-host' }}
      HEALTH_URL: http://127.0.0.1:8083/healthz
      # The commit the images must carry. A tag can point at an older build
      # after an interrupted publish, so identity is read from the label.
      EXPECTED_REVISION: ${{ github.sha }}
      GHCR_MIRRORS: ${{ vars.GHCR_MIRRORS || 'ghcr.nju.edu.cn' }}
      SSH_KEY: ${{ secrets.ZEUS_WORKBENCH_DEPLOY_SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.ZEUS_WORKBENCH_DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Check deploy credentials
        id: cred
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "::error::ZEUS_WORKBENCH_DEPLOY_HOST is not set (repository variable)"
            exit 1
          fi
          if [[ -n "${SSH_KEY:-}" ]]; then
            echo "method=key" >> "$GITHUB_OUTPUT"
          elif [[ -n "${SSH_PASSWORD:-}" ]]; then
            echo "method=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set ZEUS_WORKBENCH_DEPLOY_SSH_KEY (preferred) or ZEUS_WORKBENCH_DEPLOY_SSH_PASSWORD"
            exit 1
          fi

      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass

      - name: Upload deploy compose
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")
          COMPOSE_B64="$(base64 < examples/ai-workbench/deploy/docker-compose.deploy.yml | tr -d '\n')"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_DIR}" "${COMPOSE_B64}" <<'REMOTE'
          set -euo pipefail
          DIR="$1"; COMPOSE="$2"
          mkdir -p "$DIR"
          printf '%s' "$COMPOSE" | base64 -d > "$DIR/docker-compose.deploy.yml"
          chmod 644 "$DIR/docker-compose.deploy.yml"
          # Credentials are the operator's and already exist on this host. A
          # deploy must not invent or overwrite them: rotating a token is a
          # deliberate act, not a side effect of a release.
          for required in host.env workbench.env; do
            if [[ ! -f "$DIR/$required" ]]; then
              echo "::error::$DIR/$required is missing. Create it from the deployment docs before deploying."
              exit 1
            fi
          done
          echo "credentials present: host.env, workbench.env"
          echo "compose 已就绪: $DIR/docker-compose.deploy.yml"
          REMOTE

      - name: Rolling update containers
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")
          # `printf %q` quotes a value so the remote shell receives it verbatim
          # — empty strings, spaces, `$`, quotes. A password must never be
          # expanded by either shell on the way through.
          q() { printf '%q' "$1"; }
          # Only the required values travel as positionals. The optional ones
          # are assigned on the remote command line, because
          # `ssh host bash -s -- a "" b` drops the empty argument: every later
          # positional shifts left, and the commit hash lands where the TCR
          # repository path belongs — docker then tries to log in to a registry
          # named after a commit. Assigning them here keeps each value attached
          # to its own name, empty or not.
          REMOTE_ENV="ZEUS_TCR_IMAGE=$(q "${TCR_IMAGE}")"
          REMOTE_ENV+=" ZEUS_TCR_USER=$(q "${TCR_USERNAME}")"
          REMOTE_ENV+=" ZEUS_TCR_PASS=$(q "${TCR_PASSWORD}")"
          REMOTE_ENV+=" ZEUS_EXPECTED_REVISION=$(q "${EXPECTED_REVISION}")"
          REMOTE_ENV+=" ZEUS_TCR_HOST_DIGEST=$(q "${TCR_HOST_DIGEST}")"
          REMOTE_ENV+=" ZEUS_TCR_WORKBENCH_DIGEST=$(q "${TCR_WORKBENCH_DIGEST}")"
          # shellcheck disable=SC2029
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${REMOTE_ENV} bash -s" -- \
            "${IMAGE_REF}" "${DEPLOY_TAG}" "${IMAGE_DIGEST}" \
            "${HOST_IMAGE_REF}" "${HOST_IMAGE_DIGEST}" \
            "${CONTAINER}" "${HOST_CONTAINER}" "${DEPLOY_DIR}" "${HEALTH_URL}" "${GHCR_MIRRORS}" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; TAG="$2"; DIGEST="$3"; HOST_IMAGE="$4"; HOST_DIGEST="$5"
          CONTAINER="$6"; HOST_CONTAINER="$7"; DIR="$8"; HEALTH="$9"; MIRRORS="${10}"
          # Optional values arrive as environment variables so that an empty
          # one cannot shift the positionals. Default each: `set -u` aborts on
          # an unset name.
          TCR="${ZEUS_TCR_IMAGE:-}"
          TCR_USER="${ZEUS_TCR_USER:-}"
          TCR_PASS="${ZEUS_TCR_PASS:-}"
          EXPECTED_REVISION="${ZEUS_EXPECTED_REVISION:-}"
          TCR_HOST_DIGEST="${ZEUS_TCR_HOST_DIGEST:-}"
          TCR_WORKBENCH_DIGEST="${ZEUS_TCR_WORKBENCH_DIGEST:-}"
          CANONICAL="${IMAGE}:${TAG}"
          HOST_CANONICAL="${HOST_IMAGE}:${TAG}"

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker); echo "==> docker: direct"
          elif sudo -n true >/dev/null 2>&1; then
            DOCKER=(sudo -n docker); echo "==> docker: via sudo"
          else
            echo "::error::No docker access and no passwordless sudo on the host"
            exit 1
          fi

          # A domestic registry the host reaches over the cloud network comes
          # first; ghcr.io is the last resort because the cross-border transfer
          # is what times out.
          if [[ -n "${TCR}" && -n "${TCR_USER}" && -n "${TCR_PASS}" ]]; then
            # TCR points at a repository prefix, but docker authenticates a
            # registry. Logging in to the full path asks the daemon for
            # `<path>/v2/` and answers 404, so only the host is used here.
            TCR_HOST="${TCR%%/*}"
            if [[ "${DOCKER[0]}" == "sudo" ]]; then
              printf '%s' "${TCR_PASS}" |
                sudo -n docker login "${TCR_HOST}" -u "${TCR_USER}" --password-stdin >/dev/null
            else
              printf '%s' "${TCR_PASS}" |
                docker login "${TCR_HOST}" -u "${TCR_USER}" --password-stdin >/dev/null
            fi
            echo "==> logged in to ${TCR_HOST}"
          fi

          pull_pinned() {
            local image="$1" digest="$2" tag="$3" canonical="$4" tcr_ref="$5" tcr_digest="${6:-}"
            local repo_path="${image#ghcr.io/}"
            local candidates=()
            # The TCR digest is the identity the mirror verified. Preferring it
            # over the moving tag means a stalled publish cannot have the
            # deploy pull something other than the bytes that were built.
            if [[ -n "${TCR}" && -n "${tcr_ref}" && -n "${tcr_digest}" ]]; then
              candidates+=("${tcr_ref}@${tcr_digest}")
            fi
            [[ -n "${TCR}" && -n "${tcr_ref}" ]] && candidates+=("${tcr_ref}:${tag}")
            if [[ -n "${MIRRORS}" ]]; then
              local mirror_list=() m
              IFS=',' read -r -a mirror_list <<< "${MIRRORS}"
              for m in "${mirror_list[@]}"; do
                m="${m// /}"
                [[ -z "$m" ]] && continue
                [[ -n "$digest" ]] && candidates+=("${m}/${repo_path}@${digest}")
                candidates+=("${m}/${repo_path}:${tag}")
              done
            fi
            [[ -n "$digest" ]] && candidates+=("${image}@${digest}")
            candidates+=("${canonical}")
            local candidate
            for candidate in "${candidates[@]}"; do
              echo "==> pulling ${candidate}"
              # Bound each attempt: an unbounded pull is what killed the session.
              if timeout 300 "${DOCKER[@]}" pull "${candidate}"; then
                "${DOCKER[@]}" tag "${candidate}" "${canonical}"
                return 0
              fi
              echo "    (source failed or timed out, trying next)"
            done
            echo "::error::Every image source failed for ${canonical}"
            return 1
          }

          # The GHCR digest only applies to ghcr.io candidates; the mirrored
          # digests are valid at TCR, where the same content may be stored
          # under a different manifest digest.
          pull_pinned "${IMAGE}" "${DIGEST}" "${TAG}" "${CANONICAL}" \
            "${TCR:+${TCR}-workbench}" "${TCR_WORKBENCH_DIGEST:-}"
          pull_pinned "${HOST_IMAGE}" "${HOST_DIGEST}" "${TAG}" "${HOST_CANONICAL}" \
            "${TCR:+${TCR}-host}" "${TCR_HOST_DIGEST:-}"

          # A tag is not an identity. When TCR is configured the image comes
          # from there, and a stalled publish can leave that tag pointing at the
          # previous commit — the deploy would then "succeed" while rolling back
          # production. The build stamps the commit into a label, so check it.
          if [[ -n "${EXPECTED_REVISION:-}" ]]; then
            for ref in "${CANONICAL}" "${HOST_CANONICAL}"; do
              got="$("${DOCKER[@]}" inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${ref}" 2>/dev/null || true)"
              if [[ "${got}" != "${EXPECTED_REVISION}" ]]; then
                echo "::error::${ref} is revision '${got}', expected '${EXPECTED_REVISION}'"
                exit 1
              fi
              echo "==> ${ref} @ ${got:0:8}"
            done
          fi

          if [[ "${DOCKER[0]}" == "sudo" ]]; then
            RUN=(sudo -n env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "HOST_IMAGE_REPO=${HOST_IMAGE}" "HOST_IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "HOST_CONTAINER=${HOST_CONTAINER}" "COMPOSE_PROJECT_NAME=${CONTAINER}" "AI_DATA_DIR=/home/ubuntu/zeus-ai/data" docker)
          else
            RUN=(env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "HOST_IMAGE_REPO=${HOST_IMAGE}" "HOST_IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "HOST_CONTAINER=${HOST_CONTAINER}" "COMPOSE_PROJECT_NAME=${CONTAINER}" "AI_DATA_DIR=/home/ubuntu/zeus-ai/data" docker)
          fi

          cd "$DIR"
          # The env files are handed to compose via `env_file`, not sourced here.
          # A value like `ZEUS_AI_TOKENS=[{"token": "..."}]` is valid for Docker
          # but not for the shell: sourcing it would try to run the array as a
          # command and abort the deploy under `set -e`.
          "${RUN[@]}" compose -f docker-compose.deploy.yml up -d --pull never --remove-orphans --force-recreate

          # `up --remove-orphans` only knows the containers of *this* compose
          # project. The production pair was originally started with `docker
          # run` and carries no compose labels, so compose never sees it: the
          # old Host kept serving the ingress while a second Host opened the
          # same SQLite file. Retire by hazard, not by naming convention — any
          # container mounting this deployment's data directory is a second
          # writer of the same database.
          data_dir="/home/ubuntu/zeus-ai/data"
          for victim in $("${DOCKER[@]}" ps -aq 2>/dev/null || true); do
            name="$("${DOCKER[@]}" inspect --format '{{.Name}}' "${victim}" 2>/dev/null | sed 's#^/##')" || continue
            [[ -z "${name}" ]] && continue
            [[ "${name}" == "${CONTAINER}" || "${name}" == "${HOST_CONTAINER}" ]] && continue
            mounts="$("${DOCKER[@]}" inspect --format '{{range .Mounts}}{{.Source}} {{end}}' "${name}" 2>/dev/null || true)"
            [[ "${mounts}" != *"${data_dir}"* ]] && continue
            echo "==> retiring ${name}: another writer of ${data_dir}"
            "${DOCKER[@]}" rm -f "${name}" >/dev/null 2>&1 || true
          done

          for attempt in $(seq 1 30); do
            sleep 2
            if curl -fsS "${HEALTH}" >/dev/null 2>&1; then
              echo "==> healthy after $((attempt * 2))s"
              "${DOCKER[@]}" ps --filter "name=${CONTAINER}" --filter "name=${HOST_CONTAINER}" --format '{{.Names}} {{.Image}} {{.Status}}'
              exit 0
            fi
          done
          echo "::error::Workbench did not become healthy"
          "${DOCKER[@]}" logs --tail 50 "${CONTAINER}" || true
          "${DOCKER[@]}" logs --tail 50 "${HOST_CONTAINER}" || true
          exit 1
          REMOTE

      # A container swap is not a deployment. The ingress decides what the
      # public actually gets, and it is operator-owned configuration that CI
      # must not rewrite. So instead of assuming, ask the public URL which
      # commit it serves and fail when it is not this one: a green deploy that
      # leaves the old build live is the exact failure this step exists for.
      - name: Verify the public site serves this commit
        if: vars.ZEUS_PUBLIC_SITE_URL != ''
        run: |
          set -euo pipefail
          url="${ZEUS_PUBLIC_SITE_URL%/}/build-info.json"
          for attempt in $(seq 1 10); do
            if body="$(curl -fsS --max-time 15 "${url}" 2>/dev/null)"; then
              served="$(printf '%s' "${body}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).uiCommit||'')}catch{}})")"
              if [[ "${served}" == "${GITHUB_SHA}" ]]; then
                echo "==> ${ZEUS_PUBLIC_SITE_URL} serves ${served}"
                exit 0
              fi
              echo "    ${url} serves '${served:-<unknown>}', waiting for ${GITHUB_SHA:0:8}"
            else
              echo "    ${url} not reachable yet"
            fi
            sleep 6
          done
          {
            echo "::error::The public site does not serve ${GITHUB_SHA}."
            echo "Containers were replaced, but the ingress still points at an older build."
            echo "Point ${ZEUS_PUBLIC_SITE_URL} at the container published on 127.0.0.1:8083."
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "::error::The public site does not serve ${GITHUB_SHA}; the ingress still points at an older build"
          exit 1
        env:
          ZEUS_PUBLIC_SITE_URL: ${{ vars.ZEUS_PUBLIC_SITE_URL }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/pass
