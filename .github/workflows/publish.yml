name: Publish to NPM

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      core_version:
        required: true
        type: string
      core_commit:
        required: true
        type: string
      pairing_mode:
        required: true
        type: string
    secrets:
      NPM_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        type: choice
        options:
          - beta
          - rc
          - latest
      release_sha:
        description: Immutable release commit SHA
        required: true
        type: string
      core_version:
        description: Exact published Zeus Core version
        required: true
        type: string
      core_commit:
        description: Immutable paired Zeus Core commit SHA
        required: true
        type: string
      pairing_mode:
        description: How the pair was established (must be `online`)
        required: true
        type: string

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Release
    steps:
      - name: Verify dispatch context
        run: |
          channel_of() {
            case "$1" in
              *-canary.*) echo canary ;;
              *-rc.*) echo rc ;;
              *-beta.*) echo beta ;;
              *-*) echo invalid ;;
              *) echo latest ;;
            esac
          }
          expected="$(channel_of "$VERSION")"
          if [ "$expected" = invalid ]; then
            echo "::error::unsupported prerelease identifier in $VERSION"
            exit 1
          fi
          if [ "$TAG" != "$expected" ]; then
            echo "::error::version $VERSION must publish under dist-tag $expected, not $TAG"
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          if ! [[ "$CORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::core_commit must be a full 40-character SHA"
            exit 1
          fi
          # A static pairing report carries no Core commit at all, so a
          # dispatch that reached here with mode=static is evidence-free even
          # though `core_commit` happens to parse. The mode says which question
          # was answered; only `online` answers the pairing one.
          if [ "$PAIRING_MODE" != "online" ]; then
            echo "::error::pairing_mode is '$PAIRING_MODE'; publish requires an online pairing check"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          PAIRING_MODE: ${{ inputs.pairing_mode }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify release tag
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$RELEASE_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor -- "$RELEASE_SHA" refs/remotes/origin/main
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify build outputs
        run: pnpm check:build-output

      - name: Verify release tarballs
        run: pnpm release:verify:pack

      # A version string is not evidence of the Core candidate. The pairing
      # record committed for this exact version must name this UI commit, the
      # paired Core version and commit, the channel, and every @zeus-js/* pin
      # must match. The Core tag is re-resolved and must point at that commit.
      - name: Verify immutable Core/UI pairing
        run: |
          pnpm exec tsx scripts/checks/release/check-release-pairing.ts \
            --version "$VERSION" \
            --core-version "$CORE_VERSION" \
            --release-sha "$RELEASE_SHA" \
            --expected-core-commit "$CORE_COMMIT" \
            --online \
            --out "$PAIRING_REPORT"
        env:
          VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
          PAIRING_REPORT: ${{ runner.temp }}/release-pairing.json

      - name: Preserve pairing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-release-pairing
          path: ${{ runner.temp }}/release-pairing.json
          if-no-files-found: error

      - name: Revalidate release tag
        run: |
          # A lightweight tag resolves straight to a commit, while an annotated
          # tag resolves to a tag object first. Compare the peeled commit so both
          # tag kinds verify against the same immutable release SHA.
          remote_tag_sha="$(
            git fetch --force --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION" >/dev/null 2>&1
            git rev-parse "refs/tags/v$VERSION^{commit}"
          )"
          test "$remote_tag_sha" = "$RELEASE_SHA"
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}

      # `@baicie/release` decides "already published" from `npm view`'s exit
      # code, so a registry outage is indistinguishable from a missing version
      # and the publish loop would retry packages that already exist. This
      # preflight separates 200 / 404 / everything-else and fails closed, and
      # its report is the recovery record for a partially published release.
      - name: Verify registry reachability and the recovery set
        run: >-
          pnpm exec tsx scripts/checks/release/check-publish-preflight.ts
          --version "$VERSION"
          --tag "$TAG"
          --out "$PREFLIGHT_REPORT"
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          PREFLIGHT_REPORT: ${{ runner.temp }}/publish-preflight.json

      - name: Preserve publish preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-publish-preflight
          path: ${{ runner.temp }}/publish-preflight.json
          if-no-files-found: error

      # The baseline records what `latest` pointed at *before* this release, so
      # a first publish that binds `latest` can be told apart from a regression.
      # beta.35 failed verification and the baseline was gone with the runner,
      # which made the failure impossible to re-check afterwards. Uploading it
      # is what allows a read-only re-verification to reuse the original state
      # instead of regenerating one from the post-release world.
      - name: Capture latest dist-tag baseline
        run: pnpm release:capture:latest --output "$LATEST_BASELINE"
        env:
          LATEST_BASELINE: ${{ runner.temp }}/published-latest-baseline.json

      - name: Preserve latest dist-tag baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-publish-latest-baseline
          path: ${{ runner.temp }}/published-latest-baseline.json
          if-no-files-found: error

      - name: Publish package
        run: |
          pnpm exec tsx scripts/checks/release/check-release-channel.ts --version "$VERSION" --tag "$TAG" --context publish
          pnpm run ci-publish --version "$VERSION" --tag "$TAG"
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      # Verification is a distinct responsibility from publishing: it reads the
      # registry and writes evidence, and never publishes. Keeping it in its own
      # step is what lets verify-published-release.yml repeat it later without
      # any npm write access.
      - name: Verify published packages
        run: |
          pnpm release:verify:published \
            --version "$VERSION" \
            --tag "$TAG" \
            --latest-baseline "$LATEST_BASELINE" \
            --release-sha "$RELEASE_SHA" \
            --report "$VERIFICATION_REPORT"
        env:
          LATEST_BASELINE: ${{ runner.temp }}/published-latest-baseline.json
          VERIFICATION_REPORT: ${{ runner.temp }}/registry-verification.json
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          ZEUS_REGISTRY_VERIFICATION_WINDOW_SECONDS: '600'

      # Evidence is uploaded with `if: always()` so a failed verification still
      # leaves the structured report behind. That is the whole point of the
      # report: a red check with no artifact is what made beta.35's failure
      # take a re-run to diagnose.
      - name: Preserve registry verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-registry-verification
          path: ${{ runner.temp }}/registry-verification.json
          if-no-files-found: warn
