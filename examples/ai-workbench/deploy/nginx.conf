limit_req_zone $binary_remote_addr zone=ai_workbench:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ai_workbench_conns:10m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # BYOK lets a user point the browser at their own model gateway, so the page
  # has to be allowed to open connections to origins the operator names. The
  # default is still `'self'`: an operator opts in by setting
  # ZEUS_BYOK_CONNECT_SRC to a space-separated CSP source list, for example
  #   ZEUS_BYOK_CONNECT_SRC="https://api.openai.com https://gateway.example.com"
  # Anything left unset substitutes away to nothing, so a deployment that does
  # not configure BYOK keeps the original policy byte for byte.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'${ZEUS_BYOK_CONNECT_SRC_SPACED}; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  # The upstream token is injected server-side; it never reaches the browser.
  # NGINX_ENVSUBST_FILTER limits substitution to this variable.
  location /ai-host/ {
    limit_req zone=ai_workbench burst=60 nodelay;
    limit_conn ai_workbench_conns 10;
    proxy_pass http://ai-host:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, not append: the Host trusts this value for per-visitor limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer ${ZEUS_AI_UPSTREAM_TOKEN}";
    # Server-sent events must not be buffered by the proxy.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
