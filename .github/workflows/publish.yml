name: Publish to NPM

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      core_commit:
        required: true
        type: string
    secrets:
      NPM_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        type: choice
        options:
          - beta
          - rc
          - latest
      release_sha:
        description: Immutable release commit SHA
        required: true
        type: string
      core_commit:
        description: Immutable paired Zeus Core commit SHA
        required: true
        type: string

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Release
    steps:
      - name: Verify dispatch context
        run: |
          channel_of() {
            case "$1" in
              *-canary.*) echo canary ;;
              *-rc.*) echo rc ;;
              *-beta.*) echo beta ;;
              *-*) echo invalid ;;
              *) echo latest ;;
            esac
          }
          expected="$(channel_of "$VERSION")"
          if [ "$expected" = invalid ]; then
            echo "::error::unsupported prerelease identifier in $VERSION"
            exit 1
          fi
          if [ "$TAG" != "$expected" ]; then
            echo "::error::version $VERSION must publish under dist-tag $expected, not $TAG"
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          if ! [[ "$CORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::core_commit must be a full 40-character SHA"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CORE_COMMIT: ${{ inputs.core_commit }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify release tag
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$RELEASE_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor -- "$RELEASE_SHA" refs/remotes/origin/main
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify build outputs
        run: pnpm check:build-output

      - name: Verify release tarballs
        run: pnpm release:verify:pack

      # A version string is not evidence of the Core candidate. The pairing
      # record committed for this exact version must name this UI commit, the
      # paired Core version and commit, the channel, and every @zeus-js/* pin
      # must match. The Core tag is re-resolved and must point at that commit.
      - name: Verify immutable Core/UI pairing
        run: |
          pnpm exec tsx scripts/checks/release/check-release-pairing.ts \
            --version "$VERSION" \
            --release-sha "$RELEASE_SHA" \
            --core-commit "$CORE_COMMIT" \
            --out "$PAIRING_REPORT"
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          PAIRING_REPORT: ${{ runner.temp }}/release-pairing.json
          GH_TOKEN: ${{ github.token }}

      - name: Preserve pairing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-release-pairing
          path: ${{ runner.temp }}/release-pairing.json
          if-no-files-found: error

      - name: Revalidate release tag
        run: |
          # A lightweight tag resolves straight to a commit, while an annotated
          # tag resolves to a tag object first. Compare the peeled commit so both
          # tag kinds verify against the same immutable release SHA.
          remote_tag_sha="$(
            git fetch --force --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION" >/dev/null 2>&1
            git rev-parse "refs/tags/v$VERSION^{commit}"
          )"
          test "$remote_tag_sha" = "$RELEASE_SHA"
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}

      - name: Capture latest dist-tag baseline
        run: pnpm release:capture:latest --output "$LATEST_BASELINE"
        env:
          LATEST_BASELINE: ${{ runner.temp }}/published-latest-baseline.json

      - name: Publish package
        run: |
          pnpm exec tsx scripts/checks/release/check-release-channel.ts --version "$VERSION" --tag "$TAG" --context publish
          pnpm run ci-publish --version "$VERSION" --tag "$TAG"
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Verify published packages
        run: pnpm release:verify:published --version "$VERSION" --tag "$TAG" --latest-baseline "$LATEST_BASELINE" --release-sha "$RELEASE_SHA"
        env:
          LATEST_BASELINE: ${{ runner.temp }}/published-latest-baseline.json
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
