# Read-only re-verification of a published release.
#
# ## Why this exists
#
# beta.35 published all 46 packages, then failed `Verify published packages`
# because the registry had not finished propagating. The packages were fine;
# the run was red. The only way to make the check green was to re-run the whole
# publish workflow, which means the verification step could not be repeated
# without also re-entering the publish path.
#
# This workflow separates the two. It answers one question — "is the release
# that npm serves the release we intended?" — and it is structurally unable to
# do anything else:
#
# - no `NPM_PUBLISH_TOKEN`: the only secret needed is `GITHUB_TOKEN`, which is
#   read-only here;
# - `permissions: contents: read`: it cannot create, move or delete a tag;
# - no `npm publish`, `npm dist-tag`, `npm unpublish` anywhere in the file;
# - it never checks out to write; everything it produces is an artifact.
#
# ## Inputs
#
# The original publish run ID and its latest-baseline artifact are inputs on
# purpose. Re-deriving the baseline from the post-release registry would make
# the check compare the release against itself — it would "pass" no matter
# what had been published. When the original baseline is unavailable the run
# must say so, not invent one.
name: Verify Published Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to verify, for example 0.1.0-beta.35'
        required: true
        type: string
      tag:
        description: npm dist-tag that must point at this version
        required: true
        default: beta
        type: choice
        options:
          - beta
          - rc
          - latest
      release_sha:
        description: The 40-character commit the release tag points at
        required: true
        type: string
      tool_ref:
        description: Full commit SHA of the verifier to run; never a branch
        required: true
        type: string
      publish_run_id:
        description: The publish workflow run that produced the release, used to locate the original latest-baseline artifact
        required: true
        type: string
      baseline_artifact:
        description: Name of the latest-baseline artifact on that run
        required: true
        default: ui-publish-latest-baseline
        type: string

permissions:
  contents: read

concurrency:
  group: verify-published-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      # Two checkouts, deliberately.
      #
      # The first version of this workflow checked out the release tag and then
      # ran the verifier from that same tree. That cannot work for a historical
      # release: the verifier did not exist when v0.1.0-beta.35 was tagged.
      # Confirmed against the real tag — verify-published-release.yml returns
      # 404 at refs/tags/v0.1.0-beta.35.
      #
      # So the tool comes from a commit the caller names, and the target comes
      # from the immutable tag. Each is recorded separately. The tool may be
      # newer than the target; what the *expected* contract is still comes from
      # the target, never from the tool.
      - name: Check out the release tag as data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/v${{ inputs.version }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the verifier tool
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tool_ref }}
          path: tools
          fetch-depth: 1
          persist-credentials: false

      - name: Record what was checked out
        id: checkouts
        run: |
          target_sha="$(git -C target rev-parse HEAD)"
          tool_sha="$(git -C tools rev-parse HEAD)"

          if [ "$target_sha" != "$RELEASE_SHA" ]; then
            echo "::error::v$VERSION resolves to $target_sha, expected $RELEASE_SHA"
            exit 1
          fi
          if [ "$tool_sha" != "$TOOL_REF" ]; then
            echo "::error::verifier checked out at $tool_sha, expected $TOOL_REF"
            exit 1
          fi

          {
            echo "## Checkouts"
            echo
            echo "| role | ref | commit |"
            echo "| --- | --- | --- |"
            echo "| target (data) | v$VERSION | $target_sha |"
            echo "| verifier (tool) | $TOOL_REF | $tool_sha |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TOOL_REF: ${{ inputs.tool_ref }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: tools/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: tools/.node-version
          cache: pnpm
          cache-dependency-path: tools/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # Only the tool is installed. Nothing executes from the target tree.
      - name: Install the verifier
        working-directory: tools
        run: pnpm install --frozen-lockfile

      # The guard is the point of the workflow: a future edit that adds a
      # publish command should fail here, before it can reach npm.
      #
      # It parses the workflow and inspects only step `run` bodies. A grep over
      # the whole file was the first attempt and was useless: it matched the
      # comment above describing what must not happen, and the
      # `release:verify:published` script name.
      - name: Assert this workflow cannot publish
        working-directory: tools
        run: |
          node -e '
            const { readFileSync } = require("node:fs")
            const { parse } = require("yaml")

            const workflow = parse(readFileSync(".github/workflows/verify-published-release.yml", "utf8"))
            const forbidden = /\b(npm|pnpm)\s+(publish|dist-tag|unpublish)\b|\bnpm\s+(deprecate|owner|access)\b/
            const offenders = []

            for (const [jobName, job] of Object.entries(workflow.jobs ?? {})) {
              for (const step of job.steps ?? []) {
                const run = typeof step.run === "string" ? step.run : ""
                // Shell comments describe what must not happen; they are not
                // commands. Stripping them is what makes this check usable.
                const commands = run
                  .split("\n")
                  .map(line => line.replace(/(^|\s)#.*$/, ""))
                  .join("\n")
                if (forbidden.test(commands)) offenders.push(`${jobName} / ${step.name ?? "unnamed"}`)
                // A verification workflow has no business holding a publish token.
                for (const key of ["NPM_PUBLISH_TOKEN", "NODE_AUTH_TOKEN", "NPM_TOKEN"]) {
                  if (JSON.stringify(step.env ?? {}).includes(`secrets.${key}`)) {
                    offenders.push(`${jobName} / ${step.name ?? "unnamed"} reads secrets.${key}`)
                  }
                }
              }
            }

            if (offenders.length > 0) {
              console.error("::error::verify-published-release.yml must not publish: " + offenders.join(", "))
              process.exit(1)
            }
            console.log("no publish commands or publish tokens present")
          '

      - name: Resolve the release tag commit
        run: |
          tag_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::v$VERSION points at $tag_sha, expected $RELEASE_SHA"
            exit 1
          fi
          echo "release tag matches the requested commit"
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}

      # The expected contract comes from the target, not the tool. A verifier
      # running months later must check the release against what the release
      # itself declared, or it would compare the release to itself.
      - name: Read the expected contract from the target
        run: |
          node -e '
            const { readFileSync } = require("node:fs")
            const manifest = JSON.parse(readFileSync("target/package.json", "utf8"))
            const expected = manifest.version

            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(expected)) {
              console.error("::error::target/package.json has no usable version: " + expected)
              process.exit(1)
            }
            if (expected !== process.env.VERSION) {
              console.error("::error::target declares " + expected + ", run asked for " + process.env.VERSION)
              process.exit(1)
            }
            console.log("contract version " + expected + " read from the release tag")
          '
        env:
          VERSION: ${{ inputs.version }}

      # The baseline comes from the original publish run, never regenerated
      # here: regenerating compares the release against the post-release
      # registry, which passes no matter what shipped.
      #
      # A missing baseline is not fatal to the other checks. It stays UNKNOWN
      # and keeps the verdict from being a full PASS. Substituting a fresh
      # baseline would be the exact failure this workflow exists to prevent.
      - name: Restore the original latest dist-tag baseline
        id: baseline
        run: |
          mkdir -p "$BASELINE_DIR"

          if gh run download "$PUBLISH_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$BASELINE_ARTIFACT" \
              --dir "$BASELINE_DIR" 2>/dev/null \
            && [ -f "$BASELINE_DIR/published-latest-baseline.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "restored the baseline recorded by run $PUBLISH_RUN_ID"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### HISTORICAL_LATEST_BASELINE: UNKNOWN"
              echo
              echo "Run $PUBLISH_RUN_ID carries no \`$BASELINE_ARTIFACT\` artifact."
              echo "It was published before the baseline was ever uploaded, so the"
              echo "pre-release \`latest\` values cannot be recovered."
              echo
              echo "Independent checks still run. This item stays UNKNOWN and the"
              echo "verdict cannot be a full PASS."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::no original baseline on run $PUBLISH_RUN_ID; HISTORICAL_LATEST_BASELINE stays UNKNOWN"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_DIR: ${{ runner.temp }}/baseline
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}

      # Read-only verification. The window defaults to ten minutes and is
      # raised here because this run exists precisely for the tail of npm's
      # propagation, which is slower than the publish-time window.
      - name: Verify published packages against the registry
        id: registry
        continue-on-error: true
        working-directory: tools
        run: |
          pnpm release:verify:published \
            --version "$VERSION" \
            --tag "$TAG" \
            --latest-baseline "$BASELINE" \
            --release-sha "$RELEASE_SHA" \
            --report "$REPORT"
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          BASELINE: ${{ runner.temp }}/baseline/published-latest-baseline.json
          REPORT: ${{ runner.temp }}/registry-verification.json
          ZEUS_REGISTRY_VERIFICATION_WINDOW_SECONDS: '600'

      # Independent of the registry check: these do not need a baseline and
      # must still be reported when the baseline is missing.
      - name: Verify tarballs, integrity, dependencies, tags and provenance
        id: packages
        continue-on-error: true
        run: |
          node tools/scripts/checks/release/verify-historical-release.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --target target \
            --registry https://registry.npmjs.org \
            --baseline-found "$BASELINE_FOUND" \
            --out "$OUT"
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
          OUT: ${{ runner.temp }}/historical-verification.json

      - name: Summarize the verdict
        if: always()
        run: |
          {
            echo "## Verification of $VERSION"
            echo
            echo "- registry check: $REGISTRY_OUTCOME"
            echo "- package checks: $PACKAGES_OUTCOME"
            echo "- original baseline: $([ "$BASELINE_FOUND" = "true" ] && echo present || echo UNKNOWN)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$PACKAGES_REPORT" ]; then
            node -e '
              const report = require(process.env.PACKAGES_REPORT)
              const lines = [
                "| item | status | detail |",
                "| --- | --- | --- |",
                ...Object.entries(report.items).map(
                  ([name, entry]) => `| ${name} | ${entry.status} | ${entry.detail} |`,
                ),
                "",
                `**verdict: ${report.verdict}**`,
                "",
              ]
              require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
            '
          else
            echo "No package verification report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "$REGISTRY_REPORT" ]; then
            node -e '
              const report = require(process.env.REGISTRY_REPORT)
              const lines = [
                `Registry: ${report.summary.verified}/${report.summary.total} verified`,
                "",
                ...report.packages
                  .filter(pkg => pkg.status !== "VERIFIED")
                  .map(pkg => `- ${pkg.package}: ${pkg.status}${pkg.errorKind ? ` (${pkg.errorKind})` : ""}`),
                "",
              ]
              require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
            '
          fi
        env:
          REGISTRY_REPORT: ${{ runner.temp }}/registry-verification.json
          PACKAGES_REPORT: ${{ runner.temp }}/historical-verification.json
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
          PACKAGES_OUTCOME: ${{ steps.packages.outcome }}

      # Evidence is kept whether the verdict passed or failed. A re-run that
      # leaves no artifact proves nothing about the release.
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-release-reverification
          path: |
            ${{ runner.temp }}/registry-verification.json
            ${{ runner.temp }}/historical-verification.json
          if-no-files-found: warn

      # A full PASS needs the registry check, the package checks, and the
      # original baseline. A missing baseline keeps this red on purpose: the
      # release is not fully accepted, and reporting otherwise is the failure
      # this workflow exists to prevent.
      - name: Enforce the verdict
        if: always()
        run: |
          if [ "$REGISTRY_OUTCOME" != "success" ] \
            || [ "$PACKAGES_OUTCOME" != "success" ] \
            || [ "$BASELINE_FOUND" != "true" ]; then
            echo "::error::release $VERSION is not fully accepted; see the summary and artifacts"
            exit 1
          fi
          echo "release $VERSION verified against the registry with the original baseline"
        env:
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
          PACKAGES_OUTCOME: ${{ steps.packages.outcome }}
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
