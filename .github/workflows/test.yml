name: test

on: workflow_call

permissions:
  contents: read

concurrency:
  group: test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-grid-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zeus-web/data-grid check:bench
      - name: Run Data Grid benchmark
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/data-grid-benchmark
          pnpm data-grid:bench 2>&1 | tee .artifacts/data-grid-benchmark/results.log
      - run: pnpm check:data-grid-benchmark-baseline
      - name: Write Data Grid benchmark report
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/data-grid-benchmark
          if [[ -f .artifacts/data-grid-benchmark/results.log ]]; then
            pnpm report:data-grid-benchmark .artifacts/data-grid-benchmark/results.log .artifacts/data-grid-benchmark/report.json
          else
            printf '{"schemaVersion":1,"runCount":0,"error":"benchmark did not produce a log"}\n' > .artifacts/data-grid-benchmark/report.json
          fi
      - name: Capture Data Grid benchmark environment
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/data-grid-benchmark
          {
            node --version
            uname -a
            git rev-parse HEAD
          } > .artifacts/data-grid-benchmark/environment.txt
      - name: Upload Data Grid benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-grid-benchmark-${{ github.run_id }}
          path: .artifacts/data-grid-benchmark

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run advanced component runtime tests
        run: pnpm exec vitest --project e2e --run
      - name: Verify DataGrid React 18 consumer fixture
        run: |
          pnpm --filter @zeus-web/example-data-grid-react18-consumer check
          pnpm --filter @zeus-web/example-data-grid-react18-consumer test
      - run: pnpm build:examples
      - run: pnpm test-unit:node
      - run: pnpm test-unit:jsdom
      - run: pnpm test-unit:react-showcase

  data-grid-framework-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set Playwright browser cache path and version
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> "$GITHUB_ENV"
          PLAYWRIGHT_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"
      - name: Cache DataGrid framework renderer browsers
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-playwright-framework-renderer-v1-${{ env.PLAYWRIGHT_VERSION }}
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          restore-keys: |
            ${{ runner.os }}-playwright-framework-renderer-v1-
      - name: Install DataGrid framework renderer browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run DataGrid framework renderer browser E2E
        run: |
          pnpm exec tsc -p e2e/advanced/data-grid/framework-renderer/tsconfig.json
          pnpm data-grid:framework-e2e

  unit-test-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:examples
      - run: pnpm test-unit:node
      - run: pnpm test-unit:jsdom
      - run: pnpm test-unit:react-showcase

  build-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:build-output

  lint-and-test-dts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format-check
      - run: pnpm run check
