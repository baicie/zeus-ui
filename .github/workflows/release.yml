name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0-beta.0, 0.2.0-rc.0 or 0.2.0'
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - rc
          - latest
      dry_run:
        description: Run with --dry-run (no commit, no publish)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-context:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Verify release context
        run: test "$GITHUB_REF" = "refs/heads/main"

      # The version decides the channel; an explicit tag that disagrees with it
      # is a release-channel error. This job intentionally checks out nothing,
      # so the rule below is self-contained shell. scripts/checks/release/
      # check-release-channel.ts enforces the identical rule in the CLI guard
      # and its unit tests keep the two in sync.
      - name: Verify release channel
        run: |
          channel_of() {
            case "$1" in
              *-canary.*) echo canary ;;
              *-rc.*) echo rc ;;
              *-beta.*) echo beta ;;
              *-*) echo invalid ;;
              *) echo latest ;;
            esac
          }
          expected="$(channel_of "$VERSION")"
          if [ "$expected" = invalid ]; then
            echo "::error::unsupported prerelease identifier in $VERSION"
            exit 1
          fi
          if [ "$TAG" != "$expected" ]; then
            echo "::error::version $VERSION must publish under dist-tag $expected, not $TAG"
            exit 1
          fi

  dry-run:
    needs: validate-context
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify dispatch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Dry-run release
        run: |
          pnpm release "$VERSION" --tag "$TAG" --dry

  release:
    needs: validate-context
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.tag_release.outputs.sha }}
      core_commit: ${{ steps.pairing_core.outputs.core_commit }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify dispatch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify prepared release
        run: |
          test -z "$(git status --porcelain)"
          # The release version must already be committed on main before this
          # workflow runs. `pnpm release` bumps every package manifest, and the
          # tag below must point at the dispatch revision, so a version bump
          # performed here would have to be pushed and retagged. Assert the
          # manifests already carry the release version instead of running the
          # bump: a mismatch fails closed here rather than publishing a package
          # whose manifest disagrees with its tag.
          node -e "
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.version !== process.env.VERSION) {
            console.error('root package.json is ' + pkg.version + ', expected ' + process.env.VERSION);
            process.exit(1);
          }
          "
          test -z "$(git status --porcelain)"

      # The committed pairing record is what binds this UI release to a Core
      # candidate. It is read here, before the tag exists, so an unpairable
      # version can never be tagged in the first place.
      - name: Verify immutable Core/UI pairing
        id: pairing_core
        run: |
          pnpm exec tsx scripts/checks/release/check-release-pairing.ts \
            --version "$VERSION" \
            --release-sha "$GITHUB_SHA" \
            --out "$PAIRING_REPORT"
          core_commit="$(node -p "require('./release-pairing/$VERSION.json').coreCommit")"
          echo "core_commit=$core_commit" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          PAIRING_REPORT: ${{ runner.temp }}/release-pairing.json
          GH_TOKEN: ${{ github.token }}

      - name: Preserve pairing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-release-pairing-release
          path: ${{ runner.temp }}/release-pairing.json
          if-no-files-found: error

      - name: Tag release
        id: tag_release
        run: |
          release_sha="$(git rev-parse HEAD)"
          tag_api="repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION"

          test "$release_sha" = "$GITHUB_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$release_sha"

          if tag_sha="$(gh api "$tag_api" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$release_sha"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="refs/tags/v$VERSION" \
              --raw-field sha="$release_sha" >/dev/null
          fi

          test "$(gh api "$tag_api" --jq '.object.sha')" = "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  dispatch-publish:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
      CORE_COMMIT: ${{ needs.release.outputs.core_commit }}

    steps:
      # The Core commit comes from the pairing record read by the release job;
      # a moved Core branch or a hand-typed SHA can never be dispatched. The
      # tag is re-resolved here so the dispatch proves the Core release the UI
      # was built against is the one that actually exists.
      - name: Verify the Core release is immutable
        run: |
          if ! [[ "$CORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pairing record coreCommit is not a full SHA"
            exit 1
          fi
          test "$(gh api "repos/baicie/zeus/commits/v$VERSION" --jq '.sha')" = "$CORE_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CORE_COMMIT: ${{ needs.release.outputs.core_commit }}

      - name: Dispatch publish workflow
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v$VERSION" \
            --raw-field version="$VERSION" \
            --raw-field tag="$TAG" \
            --raw-field release_sha="$RELEASE_SHA" \
            --raw-field core_commit="$CORE_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
          CORE_COMMIT: ${{ needs.release.outputs.core_commit }}
